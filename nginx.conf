events {
    worker_connections 2048;
}

http {
    # Upstream servers (for load balancing)
    upstream latenite_backend {
        least_conn;  # Load balance based on least connections
        server latenite-ai:5000 max_fails=3 fail_timeout=30s;
        # Add more servers here for scaling:
        # server latenite-ai-2:5000 max_fails=3 fail_timeout=30s;
        # server latenite-ai-3:5000 max_fails=3 fail_timeout=30s;
    }

    # WebSocket upgrade configuration
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Rate limiting to prevent abuse
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name _;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Max upload size for file uploads
        client_max_body_size 10M;
        client_body_timeout 60s;

        # Logging
        access_log /var/log/nginx/latenite-access.log;
        error_log /var/log/nginx/latenite-error.log warn;

        # Main application
        location / {
            proxy_pass http://latenite_backend;
            proxy_http_version 1.1;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for long-running operations
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # 5 minutes for long AI responses
            
            # Buffer settings
            proxy_buffering off;
            proxy_buffer_size 4k;
        }

        # Socket.io specific endpoint
        location /socket.io/ {
            proxy_pass http://latenite_backend;
            proxy_http_version 1.1;
            
            # WebSocket upgrade (critical for Socket.io)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            
            # Disable caching for WebSocket
            proxy_cache_bypass $http_upgrade;
            
            # Long timeout for persistent WebSocket connections
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
            
            # Headers
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API routes with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://latenite_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Longer timeout for AI API calls
            proxy_read_timeout 300s;
        }

        # File upload endpoint with separate rate limit
        location /api/upload {
            limit_req zone=upload_limit burst=10 nodelay;
            
            proxy_pass http://latenite_backend;
            client_max_body_size 10M;
            proxy_read_timeout 120s;
        }

        # Health check endpoint (no rate limit)
        location /api/health {
            proxy_pass http://latenite_backend;
            access_log off;
        }

        # Static files caching
        location /_next/static/ {
            proxy_pass http://latenite_backend;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=3600, immutable";
        }
    }
}

