version: '3.8'

services:
  # Main Latenite AI Application
  latenite-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: latenite-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXT_PUBLIC_QDRANT_URL=http://qdrant:6333
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:5000}
    volumes:
      # Persist session data
      - session-data:/app/data
      # Persist logs
      - ./logs:/app/logs
    networks:
      - latenite-network
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Qdrant Vector Database (for semantic search)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: latenite-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - latenite-network
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (for multi-user load balancing)
  nginx:
    image: nginx:alpine
    container_name: latenite-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - latenite-network
    depends_on:
      - latenite-ai

volumes:
  session-data:
    driver: local
  qdrant-data:
    driver: local

networks:
  latenite-network:
    driver: bridge

