version: '3.8'

# Development configuration with hot reload
services:
  latenite-ai-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: latenite-ai-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEXT_PUBLIC_QDRANT_URL=http://qdrant:6333
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
      # Persist session data
      - session-data:/app/data
    networks:
      - latenite-network
    depends_on:
      - qdrant
    command: npm run dev

  qdrant:
    image: qdrant/qdrant:latest
    container_name: latenite-qdrant-dev
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data-dev:/qdrant/storage
    networks:
      - latenite-network

volumes:
  session-data:
  qdrant-data-dev:

networks:
  latenite-network:
    driver: bridge

